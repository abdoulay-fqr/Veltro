name: Veltro CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  # ── Build common-lib first (all services depend on it) ──────────────────────
  common-lib:
    name: Build common-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Install common-lib to local Maven repo
        run: cd backend/common-lib && mvn install -DskipTests -q
      - name: Upload common-lib to cache
        uses: actions/upload-artifact@v4
        with:
          name: common-lib-jar
          path: ~/.m2/repository/com/veltro/common-lib/

  # ── Test each service ───────────────────────────────────────────────────────
  test-auth:
    name: Test auth-service
    needs: common-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin', cache: 'maven' }
      - uses: actions/download-artifact@v4
        with: { name: common-lib-jar, path: ~/.m2/repository/com/veltro/common-lib/ }
      - run: cd backend/auth-service && mvn test -Dspring.profiles.active=test

  test-user:
    name: Test user-service
    needs: common-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin', cache: 'maven' }
      - uses: actions/download-artifact@v4
        with: { name: common-lib-jar, path: ~/.m2/repository/com/veltro/common-lib/ }
      - run: cd backend/user-service && mvn test -Dspring.profiles.active=test

  test-subscription:
    name: Test subscription-service
    needs: common-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin', cache: 'maven' }
      - uses: actions/download-artifact@v4
        with: { name: common-lib-jar, path: ~/.m2/repository/com/veltro/common-lib/ }
      - run: cd backend/subscription-service && mvn test -Dspring.profiles.active=test

  test-booking:
    name: Test booking-service
    needs: common-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin', cache: 'maven' }
      - uses: actions/download-artifact@v4
        with: { name: common-lib-jar, path: ~/.m2/repository/com/veltro/common-lib/ }
      - run: cd backend/booking-service && mvn test -Dspring.profiles.active=test

  test-activity:
    name: Test activity-service
    needs: common-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin', cache: 'maven' }
      - uses: actions/download-artifact@v4
        with: { name: common-lib-jar, path: ~/.m2/repository/com/veltro/common-lib/ }
      - run: cd backend/activity-service && mvn test -Dspring.profiles.active=test

  test-messaging:
    name: Test messaging-service
    needs: common-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin', cache: 'maven' }
      - uses: actions/download-artifact@v4
        with: { name: common-lib-jar, path: ~/.m2/repository/com/veltro/common-lib/ }
      - run: cd backend/messaging-service && mvn test -Dspring.profiles.active=test

  test-shop:
    name: Test shop-service
    needs: common-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin', cache: 'maven' }
      - uses: actions/download-artifact@v4
        with: { name: common-lib-jar, path: ~/.m2/repository/com/veltro/common-lib/ }
      - run: cd backend/shop-service && mvn test -Dspring.profiles.active=test

  # ── Web frontend ────────────────────────────────────────────────────────────
  web-lint:
    name: Web — lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-web/package-lock.json
      - run: cd frontend-web && npm ci
      - run: cd frontend-web && npm run lint || true
      - run: cd frontend-web && npx tsc --noEmit || true

  # ── Gate ────────────────────────────────────────────────────────────────────
  all-green:
    name: All tests passed
    needs:
      - test-auth
      - test-user
      - test-subscription
      - test-booking
      - test-activity
      - test-messaging
      - test-shop
      - web-lint
    runs-on: ubuntu-latest
    steps:
      - run: echo "All CI checks passed ✓"
