spring.application.name=notification-service
server.port=8086

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Actuator
management.endpoints.web.exposure.include=health,info

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=veltro
spring.rabbitmq.password=veltro123

# Mailtrap SMTP (dev email testing)
spring.mail.host=smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=your-mailtrap-username
spring.mail.password=your-mailtrap-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

notification.email.from=noreply@veltro.gym
notification.retry.max-attempts=3
notification.retry.backoff-delay=2000

# FCM configuration (leave blank to use console stub)
fcm.project-id=
fcm.server-key=
