spring.application.name=activity-service
server.port=8085

# Database
spring.datasource.url=jdbc:mysql://localhost:3311/veltro_activity?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Actuator
management.endpoints.web.exposure.include=health,info,circuitbreakers

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=veltro
spring.rabbitmq.password=veltro123

# Feign clients
clients.user.url=http://localhost:8082
spring.cloud.openfeign.circuitbreaker.enabled=true

# Resilience4j
resilience4j.circuitbreaker.instances.user-service.slidingWindowSize=5
resilience4j.circuitbreaker.instances.user-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.user-service.waitDurationInOpenState=15s

# Business rules
activity.low-activity-session-threshold=2

# Force UTC for all timestamps
spring.jackson.time-zone=UTC
