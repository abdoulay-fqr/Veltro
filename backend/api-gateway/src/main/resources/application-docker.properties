# Docker-profile overrides: replace localhost URIs with container service names.
#
# Full route definitions are repeated here (not just the uri fields) because
# Spring Boot's List binding for indexed properties creates each route element
# from the highest-priority source that defines ANY sub-property for that index.
# Defining only .uri in this file causes routes[N].predicates to be null,
# which throws "Predicate must not be null" at startup.

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/

cors.allowed-origins=http://localhost:3000

spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://auth-service:8081
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/auth/**

spring.cloud.gateway.server.webmvc.routes[1].id=user-service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://user-service:8082
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/users/**

