spring.application.name=subscription-service
server.port=8083

# Database
spring.datasource.url=jdbc:mysql://localhost:3309/veltro_subscription?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Actuator
management.endpoints.web.exposure.include=health,info,circuitbreakers

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=veltro
spring.rabbitmq.password=veltro123

# Resilience4j circuit breaker for user-service calls
resilience4j.circuitbreaker.instances.user-service.slidingWindowSize=10
resilience4j.circuitbreaker.instances.user-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.user-service.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.user-service.permittedNumberOfCallsInHalfOpenState=3

# User service URL (for optional member existence check)
user-service.base-url=http://localhost:8082

# Force UTC for all timestamps
spring.jackson.time-zone=UTC
