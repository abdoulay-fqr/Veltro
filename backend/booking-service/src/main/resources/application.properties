spring.application.name=booking-service
server.port=8084

# Database
spring.datasource.url=jdbc:mysql://localhost:3310/veltro_booking?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Actuator
management.endpoints.web.exposure.include=health,info,circuitbreakers

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=veltro
spring.rabbitmq.password=veltro123

# Feign clients
clients.subscription.url=http://localhost:8083
clients.user.url=http://localhost:8082
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=10000

# Resilience4j
resilience4j.circuitbreaker.instances.subscription-service.slidingWindowSize=5
resilience4j.circuitbreaker.instances.subscription-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.subscription-service.waitDurationInOpenState=15s
resilience4j.circuitbreaker.instances.user-service.slidingWindowSize=5
resilience4j.circuitbreaker.instances.user-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.user-service.waitDurationInOpenState=15s

# Business rules
booking.window-days=7
booking.cancellation-hours=2
attendance.absence-threshold=3

# Force UTC for all timestamps
spring.jackson.time-zone=UTC
