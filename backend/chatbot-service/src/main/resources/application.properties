spring.application.name=chatbot-service
server.port=8089

# No database — chatbot-service is stateless

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Actuator
management.endpoints.web.exposure.include=health,info,circuitbreakers

# Feign clients (direct URLs, not via Gateway to avoid circular routing)
clients.subscription.url=http://localhost:8083
clients.booking.url=http://localhost:8084
clients.activity.url=http://localhost:8085
spring.cloud.openfeign.circuitbreaker.enabled=true

# Resilience4j
resilience4j.circuitbreaker.instances.subscription-cb.slidingWindowSize=5
resilience4j.circuitbreaker.instances.subscription-cb.failureRateThreshold=50
resilience4j.circuitbreaker.instances.subscription-cb.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.booking-cb.slidingWindowSize=5
resilience4j.circuitbreaker.instances.booking-cb.failureRateThreshold=50
resilience4j.circuitbreaker.instances.booking-cb.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.activity-cb.slidingWindowSize=5
resilience4j.circuitbreaker.instances.activity-cb.failureRateThreshold=50
resilience4j.circuitbreaker.instances.activity-cb.waitDurationInOpenState=10s

# Gemini API — key loaded from environment or properties, NEVER hardcoded
gemini.api.key=${GEMINI_API_KEY:your-gemini-api-key-here}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent
gemini.api.timeout-seconds=30
gemini.api.max-output-tokens=800

# Rate limiting
chatbot.rate-limit.max-requests-per-hour=20

# Context cache TTL
chatbot.context-cache.ttl-minutes=5
